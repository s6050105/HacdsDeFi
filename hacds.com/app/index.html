<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App — hacds</title>
<meta name="description" content="hacds DeFi 控制台：兑换、流动性、借贷、HACD 赎回。">
<link rel="icon" href="/assets/img/hacds_icon_32.png">
<link rel="stylesheet" href="/assets/css/main.css?v=1792799346">
<link rel="stylesheet" href="/assets/css/app.css?v=1792799346">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="/assets/img/hacds_icon_64.png" alt="">
      <span>hacds</span>
    </a>
    <div class="nav-links">
      <a href="/">← <span data-i18n="nav.back"></span></a>
      <div class="lang">
        <button data-lang="zh">中</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
      <button class="btn btn-primary btn-sm" id="btnConnect" data-i18n="app.connect"></button>
    </div>
  </div>
</nav>

<main class="wrap app-main">

  <!-- 未连接 -->
  <div id="notConnected" class="app-empty">
    <div class="card" style="max-width:460px;margin:80px auto;text-align:center">
      <img src="/assets/img/hacds_icon_64.png" style="width:56px;height:56px;margin:0 auto 20px" alt="">
      <h2 style="font-size:20px;margin-bottom:10px" data-i18n="app.welcome"></h2>
      <p class="dim" style="font-size:14px;line-height:1.7;margin-bottom:24px" data-i18n="app.connectHint"></p>
      <button class="btn btn-primary" id="btnConnect2" style="width:100%" data-i18n="app.connect"></button>
      <p class="faint mt-4" style="font-size:12px;line-height:1.6" data-i18n="app.needWallet"></p>
    </div>
  </div>

  <!-- 已连接 -->
  <div id="connected" class="hidden">

    <!-- 账户条 -->
    <div class="acct-bar">
      <div class="acct-info">
        <div class="acct-label" data-i18n="app.account"></div>
        <div class="acct-addr mono-sm" id="acctAddr">—</div>
      </div>
      <div class="acct-balances" id="acctBalances">
        <div class="bal-item">
          <div class="bal-k">HAC</div>
          <div class="bal-v" id="balHac">—</div>
        </div>
        <div class="bal-item">
          <div class="bal-k">hacds</div>
          <div class="bal-v" id="balDs">—</div>
        </div>
        <div class="bal-item">
          <div class="bal-k">HACD</div>
          <div class="bal-v" id="balHacd">—</div>
        </div>
        <div class="bal-item">
          <div class="bal-k" data-i18n="app.contractHacd">Contract HACD</div>
          <div class="bal-v" id="balPool">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnRefresh" data-i18n="app.refresh"></button>
    </div>

    <!-- 协议状态 -->
    <div class="proto-strip" id="protoStrip">
      <div class="proto-item"><span class="pk" data-i18n="app.poolPrice"></span><span class="pv" id="pPrice">—</span></div>
      <div class="proto-item"><span class="pk" data-i18n="app.poolHac"></span><span class="pv" id="pHac">—</span></div>
      <div class="proto-item"><span class="pk" data-i18n="app.poolDs"></span><span class="pv" id="pDs">—</span></div>
      <div class="proto-item"><span class="pk" data-i18n="app.lpTotal"></span><span class="pv" id="pLp">—</span></div>
      <div class="proto-item"><span class="pk" data-i18n="app.utilization"></span><span class="pv" id="pUtil">—</span></div>
      <div class="proto-item"><span class="pk" data-i18n="app.hacdCoverage"></span><span class="pv" id="pCov">—</span></div>
      <div class="proto-item" title="合约内部积分 / 真实链上余额"><span class="pk" data-i18n="app.backing"></span><span class="pv" id="pBacking">—</span></div>
    </div>

    <!-- Tab 导航 -->
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="hacd" data-i18n="app.tabHacd"></button>
      <button class="tab" data-tab="swap" data-i18n="app.tabSwap"></button>
      <button class="tab" data-tab="liquidity" data-i18n="app.tabLiquidity"></button>
      <button class="tab" data-tab="loan" data-i18n="app.tabLoan"></button>
    </div>

    <!-- 兑换 -->
    <section class="panel hidden" data-panel="swap">
      <div class="grid-2">
        <div class="card">
          <div class="card-hd" data-i18n="app.swap"></div>

          <div class="swap-box">
            <div class="swap-side">
              <div class="swap-label" data-i18n="app.from"></div>
              <div class="swap-row">
                <input class="swap-input mono" id="swapIn" type="text" placeholder="0.0" inputmode="decimal">
                <span class="swap-token" id="swapFromSym">HAC</span>
              </div>
            </div>
            <button class="swap-arrow" id="swapFlip" title="flip">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
              </svg>
            </button>
            <div class="swap-side">
              <div class="swap-label" data-i18n="app.to"></div>
              <div class="swap-row">
                <input class="swap-input mono" id="swapOut" type="text" placeholder="0.0" readonly>
                <span class="swap-token" id="swapToSym">hacds</span>
              </div>
            </div>
          </div>

          <div class="swap-meta">
            <span data-i18n="app.minOut"></span>
            <input class="meta-input mono" id="swapMinOut" type="text" value="0" data-i18n-attr="placeholder:app.optional">
          </div>
          <div class="swap-meta">
            <span data-i18n="app.slippage"></span>
            <span class="mono" id="swapSlippage">0.50%</span>
          </div>

          <button class="btn btn-primary mt-5" id="btnSwap" style="width:100%" data-i18n="app.doSwap"></button>
        </div>

        <div class="card">
          <div class="card-hd" data-i18n="app.swapInfo"></div>
          <div class="info-rows" id="swapInfo">
            <div class="info-row"><span data-i18n="app.rate"></span><span class="mono" id="siRate">—</span></div>
            <div class="info-row"><span data-i18n="app.fee"></span><span class="mono" id="siFee">0.50%</span></div>
            <div class="info-row"><span data-i18n="app.priceImpact"></span><span class="mono" id="siImpact">—</span></div>
            <div class="info-row"><span data-i18n="app.minReceived"></span><span class="mono" id="siMin">—</span></div>
          </div>
          <div class="note info mt-5" style="font-size:13px">
            <span data-i18n="app.swapNote"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 流动性 -->
    <section class="panel hidden" data-panel="liquidity">
      <div class="grid-2">
        <div class="card">
          <div class="card-hd" data-i18n="app.addLiquidity"></div>
          <label class="field-label" data-i18n="app.hacAmount"></label>
          <input class="field-input mono" id="liqHac" type="text" placeholder="0.0" inputmode="decimal">
          <label class="field-label mt-4" data-i18n="app.dsAmount"></label>
          <input class="field-input mono" id="liqDs" type="text" placeholder="0.0" inputmode="decimal">
          <div class="mt-3 dim" style="font-size:13px">
            <span data-i18n="app.minShare"></span>:
            <input class="meta-input mono" id="liqMinShare" type="text" value="0" style="width:120px">
          </div>
          <button class="btn btn-primary mt-5" id="btnAddLiq" style="width:100%" data-i18n="app.addLiquidity"></button>
        </div>

        <div class="card">
          <div class="card-hd" data-i18n="app.myLiquidity"></div>
          <div class="info-rows">
            <div class="info-row"><span data-i18n="app.myShares"></span><span class="mono" id="myShares">—</span></div>
            <div class="info-row"><span data-i18n="app.pendingHac"></span><span class="mono" id="myPendHac">—</span></div>
            <div class="info-row"><span data-i18n="app.pendingDs"></span><span class="mono" id="myPendDs">—</span></div>
          </div>
          <button class="btn btn-ghost mt-4" id="btnHarvest" style="width:100%" data-i18n="app.harvest"></button>

          <div class="card-hd mt-6" data-i18n="app.removeLiquidity"></div>
          <label class="field-label" data-i18n="app.shareBurn"></label>
          <input class="field-input mono" id="rmShare" type="text" placeholder="0" inputmode="decimal">
          <div class="grid-2 mt-3" style="gap:8px">
            <div>
              <label class="field-label" data-i18n="app.minHacOut"></label>
              <input class="field-input mono" id="rmMinHac" type="text" value="0">
            </div>
            <div>
              <label class="field-label" data-i18n="app.minDsOut"></label>
              <input class="field-input mono" id="rmMinDs" type="text" value="0">
            </div>
          </div>
          <button class="btn btn-ghost mt-5" id="btnRmLiq" style="width:100%" data-i18n="app.removeLiquidity"></button>
        </div>
      </div>
    </section>

    <!-- 借贷 -->
    <section class="panel hidden" data-panel="loan">
      <div class="grid-2">
        <div class="card">
          <div class="card-hd" data-i18n="app.borrow"></div>
          <div class="info-rows">
            <div class="info-row"><span data-i18n="app.myCollateral"></span><span class="mono" id="myColl">—</span></div>
            <div class="info-row"><span data-i18n="app.myDebt"></span><span class="mono" id="myDebt">—</span></div>
            <div class="info-row"><span data-i18n="app.myHealth"></span><span class="mono" id="myHealth">—</span></div>
            <div class="info-row"><span data-i18n="app.maxBorrow"></span><span class="mono" id="myMaxBorrow">—</span></div>
          </div>
          <label class="field-label mt-5" data-i18n="app.borrowAmount"></label>
          <input class="field-input mono" id="borrowAmt" type="text" placeholder="0.0" inputmode="decimal">
          <button class="btn btn-primary mt-4" id="btnBorrow" style="width:100%" data-i18n="app.borrow"></button>
          <label class="field-label mt-5" data-i18n="app.repayAmount"></label>
          <input class="field-input mono" id="repayAmt" type="text" placeholder="0.0" inputmode="decimal">
          <button class="btn btn-ghost mt-4" id="btnRepay" style="width:100%" data-i18n="app.repay"></button>
        </div>

        <div class="card">
          <div class="card-hd" data-i18n="app.collateral"></div>
          <label class="field-label" data-i18n="app.collAmount"></label>
          <input class="field-input mono" id="collAmt" type="text" placeholder="0" inputmode="decimal">
          <button class="btn btn-primary mt-4" id="btnCollateral" style="width:100%" data-i18n="app.addCollateral"></button>

          <div class="note mt-5" style="font-size:13px">
            <span data-i18n="app.loanNote"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- HACD -->
    <section class="panel" data-panel="hacd">
      <div class="grid-2">

        <!-- 存入：HACD → hacds -->
        <div class="card">
          <div class="flex between center" style="margin-bottom:6px">
            <div class="card-hd" style="margin:0" data-i18n="app.hacdMint"></div>
            <span class="tag" id="mintSelCount" data-i18n="app.selNone"></span>
          </div>
          <p class="dim" style="font-size:13px;line-height:1.7;margin-bottom:10px" data-i18n="app.mintNote"></p>
          <div class="note mt-2" style="font-size:12px;line-height:1.7;margin-bottom:14px">
            <span data-i18n="app.decimalNote"></span>
          </div>

          <div class="flex between center" style="margin-bottom:8px">
            <label class="field-label" style="margin:0" data-i18n="app.myHacd"></label>
            <div class="flex gap-2">
              <button class="btn btn-ghost btn-xs" id="btnSelAll" data-i18n="app.selAll"></button>
              <button class="btn btn-ghost btn-xs" id="btnSelNone" data-i18n="app.selNone2"></button>
              <button class="btn btn-ghost btn-xs" id="btnLoadMine" data-i18n="app.loadMine"></button>
            </div>
          </div>

          <div class="pick-grid" id="myHacdGrid">
            <div class="dim" style="font-size:13px;grid-column:1/-1" data-i18n="app.clickLoadMine"></div>
          </div>

          <div class="pick-summary mt-3" id="mintSummary">
            <span data-i18n="app.selectedCount"></span>
            <b class="mono" id="mintCount">0</b>
            <span data-i18n="app.diamonds"></span>
            <span class="sep">·</span>
            <span data-i18n="app.estMint"></span>
            <b class="mono" id="mintTotalEst">—</b>
          </div>

          <button class="btn btn-primary mt-4" id="btnMint" style="width:100%" data-i18n="app.mintBtn"></button>
          <p class="faint mt-2" style="font-size:11.5px;line-height:1.6" data-i18n="app.mintSplitNote"></p>
        </div>

        <!-- 赎回：hacds → HACD -->
        <div class="card">
          <div class="card-hd" data-i18n="app.hacdRedeem"></div>
          <p class="dim" style="font-size:13.5px;line-height:1.7;margin-bottom:16px" data-i18n="app.hacdNote"></p>

          <div class="flex between center" style="margin-bottom:10px">
            <label class="field-label" style="margin:0" data-i18n="app.poolHacdLabel"></label>
            <button class="btn btn-ghost btn-sm" id="btnLoadPool" data-i18n="app.loadPool"></button>
          </div>
          <div class="pool-grid" id="poolGrid">
            <div class="dim" style="font-size:13px;grid-column:1/-1" data-i18n="app.clickLoadPool"></div>
          </div>

          <div class="mt-4">
            <label class="field-label" data-i18n="app.redeemName"></label>
            <input class="field-input mono" id="redeemName" type="text"
                   placeholder="AAAAAA" maxlength="6" style="text-transform:uppercase">
          </div>

          <div class="info-row mt-3" style="border:none;padding:6px 0">
            <span data-i18n="app.redeemCost"></span>
            <span class="mono" id="redeemCost">—</span>
          </div>

          <button class="btn btn-primary mt-3" id="btnRedeem" style="width:100%" data-i18n="app.redeemBtn"></button>
        </div>
      </div>
    </section>

    <!-- 日志 -->
    <div class="app-log" id="appLog"></div>
  </div>
</main>

<script src="/assets/js/config.js?v=1792799346"></script>
<script src="/assets/js/i18n.js?v=1792799346"></script>
<script src="/assets/js/api.js?v=1792799346"></script>
<script src="/assets/js/wallet.js?v=1792799346"></script>
<script src="/assets/js/txbuild.js?v=1792799346"></script>
<script src="/assets/js/app.js?v=1792799346"></script>
</body>
</html>
