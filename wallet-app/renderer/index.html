<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>HacdsDeFi</title>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span data-i18n="app.title">HacdsDeFi 控制台</span> <span class="ver">v0.3</span>
    <span class="slogan" data-i18n="app.slogan">冷热共用钱包 + DeFi 控制台</span></div>
  <div class="net">
    <label><span data-i18n="net.node">节点</span> <input id="node" spellcheck="false"></label>
    <label><span data-i18n="net.indexer">索引器</span> <input id="indexer" spellcheck="false" placeholder="http://…:8124"></label>
    <label><span data-i18n="net.contract">合约</span> <input id="contract" spellcheck="false"></label>
    <button id="saveNet" class="ghost" data-i18n="net.save">保存</button>
    <button id="pingNet" class="ghost" data-i18n="net.ping">检测</button>
    <span class="zoomctl" title="UI zoom">
      <button id="zoomOut" class="ghost" data-i18n-title="zoom.out" title="缩小">−</button>
      <span id="zoomVal" class="muted">100%</span>
      <button id="zoomIn" class="ghost" data-i18n-title="zoom.in" title="放大">+</button>
      <button id="zoomReset" class="ghost" data-i18n-title="zoom.reset" title="重置">⟲</button>
    </span>
    <select id="langSel" title="Language">
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
    </select>
  </div>
</header>

<section class="acct">
  <div id="lockedView">
    <span class="muted" data-i18n="acct.locked">钱包未解锁</span>
    <button id="btnCreate" class="primary" data-i18n="acct.create">创建钱包</button>
    <button id="btnImport" data-i18n="acct.import">导入钱包</button>
    <button id="btnOpen" data-i18n="acct.open">打开钱包文件…</button>
    <button id="btnWalletMgr" class="ghost" data-i18n="acct.mgr">钱包管理</button>
    <button id="pickKey" class="ghost" data-i18n="acct.useKey">用外部私钥文件</button>
  </div>
  <div id="unlockedView" hidden>
    <span class="chip">🔓</span>
    <span id="addr" class="addr clickable" title="点击切换钱包地址">—</span>
    <span class="grow"></span>
    <button id="btnRefresh" class="ghost" data-i18n="acct.refresh">刷新资产</button>
    <button id="btnExportKey" class="ghost" data-i18n="acct.exportKey">导出私钥</button>
    <button id="btnLock" class="ghost" data-i18n="acct.lockOut">锁定</button>
  </div>
</section>

<!-- 首区：资产总览 + 协议状态（解锁后显示） -->
<section class="overview" id="overview" hidden>
  <div class="ov-card" id="ovAssets">
    <div class="ov-title"><button class="ov-toggle" id="ovAssetsTgl" aria-expanded="true">▾</button><span data-i18n="ov.assets">资产总览</span></div>
    <div class="ov-body">
      <div class="asset-grid" id="assetGrid"></div>
      <div class="ov-note" id="assetNote"></div>
    </div>
  </div>
  <div class="ov-card" id="ovProto">
    <div class="ov-title"><button class="ov-toggle" id="ovProtoTgl" aria-expanded="true">▾</button><span data-i18n="ov.protocol">协议状态</span></div>
    <div class="ov-body">
      <div class="proto-grid" id="protoGrid"></div>
    </div>
  </div>
  <div class="ov-card" id="ovLoan" hidden>
    <div class="ov-title"><button class="ov-toggle" id="ovLoanTgl" aria-expanded="true">▾</button><span data-i18n="ov.loan">借贷状态</span><span class="ov-tag" data-i18n="loan.ltvTag">50% 抵押率</span></div>
    <div class="ov-body">
      <div class="proto-grid" id="loanGrid"></div>
    </div>
  </div>
</section>

<nav class="tabs" id="tabs"></nav>

<main id="panels"></main>

<!-- HACD 收藏：左网格 + 右详情栏 -->
<!-- HACD 双卡布局（2026-11-11 与网页端统一）
     左：我的钻石 → 存入；右：合约池 → 赎回
     详情改为点击弹窗，不占布局空间 -->
<section class="hacd-panel" id="hacdPanel" hidden>
  <div class="grid-2" style="width:100%">

    <!-- 左：我的钻石 → 存入 -->
    <div class="card">
      <div class="flex between center" style="margin-bottom:6px">
        <div class="card-hd" style="margin:0" data-i18n="hacd.mintTitle"></div>
        <span class="tag" id="mintSelCount">0</span>
      </div>
      <p class="desc" style="font-size:12.5px;margin-bottom:8px" data-i18n="hacd.mintNote"></p>

      <div class="flex between center" style="margin-bottom:8px">
        <span class="muted" style="font-size:12px" data-i18n="hacd.myHacd"></span>
        <div class="flex gap-2">
          <button class="ghost" id="hacdSelAll" data-i18n="hacd.selAll"></button>
          <button class="ghost" id="hacdSelNone" data-i18n="hacd.selNone"></button>
          <button class="ghost" id="hacdLoadMine" data-i18n="hacd.loadMine"></button>
        </div>
      </div>

      <div class="hacd-filter" id="hacdFilter"></div>
      <div class="hacd-grid" id="hacdGrid"></div>

      <div class="pick-summary" style="margin-top:10px">
        <span data-i18n="hacd.selected"></span>
        <b class="mono" id="mintCount">0</b>
        <span data-i18n="hacd.diamonds2"></span>
        <span class="sep">·</span>
        <span data-i18n="hacd.estMint"></span>
        <b class="mono" id="mintTotalEst">—</b>
      </div>

      <button class="primary" id="hacdDepositBulk" style="width:100%;margin-top:10px"></button>
      <p class="hint" style="margin-top:6px;font-size:11.5px" data-i18n="hacd.mintSplitNote"></p>
    </div>

    <!-- 右：合约池 → 赎回 -->
    <div class="card">
      <div class="card-hd" data-i18n="hacd.redeemTitle"></div>
      <p class="desc" style="font-size:12.5px;margin-bottom:8px" data-i18n="hacd.redeemNote"></p>

      <div class="flex between center" style="margin-bottom:8px">
        <span class="muted" style="font-size:12px" data-i18n="hacd.poolHacdLabel"></span>
        <button class="ghost" id="hacdLoadPool" data-i18n="hacd.loadPool"></button>
      </div>

      <div class="hacd-grid" id="poolHacdGrid"></div>

      <div style="margin-top:12px">
        <label class="field-label" style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px" data-i18n="hacd.redeemName"></label>
        <input id="redeemName" placeholder="AAAAAA" maxlength="6" style="width:100%;text-transform:uppercase">
      </div>

      <button class="ghost" id="hacdBatchOut" style="width:100%;margin-top:10px"></button>
      <p class="hint" style="margin-top:6px;font-size:11.5px" data-i18n="hacd.redeemHint2"></p>
    </div>

  </div>
</section>

<!-- 钻石详情弹窗 -->
<div class="modal" id="hacdModal" hidden>
  <div class="modal-box" style="max-width:560px">
    <div class="pv-head">
      <b data-i18n="hacd.detail"></b>
      <button class="ghost" id="hacdModalClose">✕</button>
    </div>
    <div id="hacdModalBody"></div>
  </div>
</div>

<!-- 通用模态框 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h3 id="mTitle">—</h3>
    <div id="mBody"></div>
    <div class="modal-foot">
      <button id="mCancel" class="ghost" data-i18n="btn.cancel">取消</button>
      <button id="mOk" class="primary" data-i18n="btn.ok">确定</button>
    </div>
  </div>
</div>

<!-- 交易预览 -->
<section class="preview" id="preview" hidden>
  <div class="pv-head">
    <b id="pvLabel">—</b>
    <button id="pvCopy" class="ghost" data-i18n="btn.copyHex">复制 hex</button>
    <button id="pvSave" class="ghost" data-i18n="btn.save">保存…</button>
    <button id="pvCheck" class="ghost" data-i18n="btn.check">校验</button>
    <button id="pvTranslate" class="ghost" data-i18n="btn.translate">翻译</button>
    <button id="pvSend" class="primary" data-i18n="btn.broadcast">广播</button>
    <button id="pvClose" class="ghost" data-i18n="btn.close">关闭</button>
  </div>
  <div class="meta">
    <span><span data-i18n="pv.bytes">字节</span> <b id="pvBytes">—</b></span>
    <span><span data-i18n="pv.fee">手续费</span> <b id="pvFee">—</b></span>
    <span><span data-i18n="pv.digest">摘要</span> <code id="pvDigest">—</code></span>
    <span id="pvSelf" class="ok"></span>
  </div>
  <div id="pvFeeNote" class="feenote" hidden></div>
  <textarea id="pvHex" readonly spellcheck="false"></textarea>
  <div id="pvTrans" class="readout" hidden></div>
</section>

<section class="logwrap" id="logwrap">
  <div class="log-resize" id="logResize" data-i18n-title="log.resize" title="拖动调整日志高度"></div>
  <div class="loghead">
    <button class="ov-toggle" id="logTgl" aria-expanded="true" data-i18n-title="ui.collapse" title="折叠/展开">▾</button>
    <span data-i18n="log.title">日志</span>
    <span class="grow"></span>
    <button id="clearLog" class="ghost" data-i18n="log.clear">清空</button>
  </div>
  <div id="log" class="log"></div>
</section>

<!-- 官方 HACD 图样库（HIP-5，与 explorer 同源） -->
<script src="vendor/diamondsvgimg.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="i18n.js"></script>
<script src="diamond-score.js"></script>
<script src="app.js"></script>
</body>
</html>
